<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>IntSeg Academy — Proyección</title>
<!--
  Ventana de proyección del modo presentador.
  Se abre desde el curso (botón "Presentar") y se controla desde la vista del presentador
  a través de un BroadcastChannel; no necesita servidor. Muestra solo la diapositiva o el video.
-->
<style>
  html,body{margin:0;height:100%;background:#000;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;overflow:hidden;}
  #escena{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000;}
  #img,#vid{max-width:100%;max-height:100%;object-fit:contain;display:none;background:#000;}
  #txt{display:none;width:78%;max-width:1400px;}
  #txt h1{font-size:6vh;margin:0 0 4vh;line-height:1.15;}
  #txt ul{margin:0;padding-left:3vw;}
  #txt li{font-size:3.6vh;margin:1.6vh 0;line-height:1.3;}
  #negro{position:fixed;inset:0;background:#000;display:none;z-index:4;}
  #inicio{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vh;text-align:center;padding:4vw;
          background:linear-gradient(135deg,#1b1530,#2b2150);cursor:pointer;}
  #inicio h2{margin:0;font-size:4.4vh;}
  #inicio p{margin:0;font-size:2.4vh;opacity:.85;max-width:60ch;}
  #inicio .boton{margin-top:2vh;background:#ff8c00;color:#1a1a1a;font-weight:800;font-size:2.4vh;padding:1.6vh 3.2vw;border-radius:1.2vh;}
  body.activa{cursor:none;}
</style>
</head>
<body>
  <div id="escena">
    <img id="img" alt=""/>
    <video id="vid" playsinline preload="auto"></video>
    <div id="txt"></div>
  </div>
  <div id="negro"></div>
  <div id="inicio">
    <h2>Pantalla de proyección</h2>
    <p>Arrastra esta ventana al proyector si no se abrió ahí, y luego haz clic para activar la pantalla completa y el audio de los videos.</p>
    <span class="boton">Haz clic aquí para comenzar</span>
  </div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const canal = new BroadcastChannel("intseg-presentador");
  const v = $("vid");
  let lista = false;
  const esc = (t) => String(t ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  // El clic del usuario es necesario para entrar a pantalla completa y para reproducir con audio
  $("inicio").addEventListener("click", async () => {
    try { await document.documentElement.requestFullscreen(); } catch (e) { /* si el navegador no lo permite, se proyecta en ventana */ }
    $("inicio").style.display = "none"; document.body.classList.add("activa"); lista = true;
    canal.postMessage({ t: "listo", lista: true });
  });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !document.fullscreenElement) canal.postMessage({ t: "tecla", k: "Escape" }); });

  function mostrar(m) {
    v.pause(); v.removeAttribute("src"); v.load();
    $("img").style.display = "none"; v.style.display = "none"; $("txt").style.display = "none";
    if (m.kind === "img") { $("img").src = m.src; $("img").style.display = "block"; }
    else if (m.kind === "video") {
      v.poster = m.poster || "";
      // si el navegador no reproduce MP4 (p. ej. algunos Chromium de Linux) se usa la versión WebM cuando existe
      const mp4 = v.canPlayType('video/mp4; codecs="avc1.42E01E"') !== "";
      v.src = (!mp4 && m.webm) ? m.webm : (m.src || m.webm);
      v.style.display = "block";
    } else {
      $("txt").innerHTML = `<h1>${esc(m.title)}</h1>` + ((m.items || []).length ? `<ul>${m.items.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>` : "");
      $("txt").style.display = "block";
    }
  }
  function control(m) {
    if (v.style.display === "none") return;
    if (m.cmd === "play") v.play().catch(() => {});
    else if (m.cmd === "pause") v.pause();
    else if (m.cmd === "toggle") (v.paused ? v.play().catch(() => {}) : v.pause());
    else if (m.cmd === "ir") v.currentTime = Math.max(0, Math.min(v.duration || 1e9, Number(m.v) || 0));
    else if (m.cmd === "rel") v.currentTime = Math.max(0, Math.min(v.duration || 1e9, v.currentTime + (Number(m.v) || 0)));
  }

  canal.onmessage = (e) => {
    const m = e.data || {};
    if (m.t === "slide") mostrar(m);
    else if (m.t === "negro") $("negro").style.display = m.on ? "block" : "none";
    else if (m.t === "video") control(m);
    else if (m.t === "hola") canal.postMessage({ t: "listo", lista });
    else if (m.t === "cerrar") window.close();
  };

  // Estado del video hacia el presentador (barra de progreso y tiempo)
  setInterval(() => {
    if (v.style.display === "none") return;
    canal.postMessage({ t: "estado", pausado: v.paused, tiempo: v.currentTime || 0, duracion: isFinite(v.duration) ? v.duration : 0, terminado: v.ended });
  }, 400);

  canal.postMessage({ t: "listo", lista: false });
})();
</script>
</body>
</html>
